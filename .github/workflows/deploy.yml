name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Project page under neybarao.github.io/natalialabbate
  # (also served via the account CNAME at www.neybarao.com/natalialabbate/).
  BASE_PATH: "/natalialabbate"
  # GA4 measurement ID. Public by design (rendered into the client bundle).
  NEXT_PUBLIC_ANALYTICS_ID: "G-CKCRVNBKNS"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx next build
        env:
          BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ env.NEXT_PUBLIC_ANALYTICS_ID }}

      # GitHub Pages ignores folders starting with an underscore (like _next)
      # unless a .nojekyll file exists at the root of the artifact.
      - run: touch ./out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
